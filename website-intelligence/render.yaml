# Render Blueprint. In Render: New > Blueprint, pick the repo, and set the Blueprint path to
# website-intelligence/render.yaml (the repository root is the parent Next.js project).
databases:
  - name: wi-postgres
    databaseName: website_intelligence
    user: wi
    plan: basic-256mb

services:
  - type: keyvalue
    name: wi-redis
    plan: starter
    # BullMQ keeps job state in Redis; eviction would silently drop queued audits.
    maxmemoryPolicy: noeviction
    ipAllowList: [] # internal connections only

  - type: web
    name: wi-api
    runtime: docker
    dockerfilePath: ./website-intelligence/apps/api/Dockerfile
    dockerContext: ./website-intelligence
    plan: starter
    healthCheckPath: /api/v1/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: API_PORT
        value: "10000"
      - key: DATABASE_URL
        fromDatabase: { name: wi-postgres, property: connectionString }
      - key: REDIS_URL
        fromService: { type: keyvalue, name: wi-redis, property: connectionString }
      - key: CORS_ORIGINS
        sync: false # your Vercel origin(s), comma-separated, exact match, e.g. https://your-app.vercel.app
      - key: TRUST_PROXY_HOPS
        value: "1" # verify after deploy, see docs/deployment.md

  - type: worker
    name: wi-worker
    runtime: docker
    dockerfilePath: ./website-intelligence/apps/worker/Dockerfile
    dockerContext: ./website-intelligence
    plan: standard # headless Chromium needs roughly 1-2 GB RAM; a 512 MB plan will be OOM-killed
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase: { name: wi-postgres, property: connectionString }
      - key: REDIS_URL
        fromService: { type: keyvalue, name: wi-redis, property: connectionString }
      - key: PAGESPEED_API_KEY
        sync: false
      - key: WORKER_CONCURRENCY
        value: "1"
      # Chromium's sandbox needs user namespaces, which Render containers typically don't grant.
      # Mitigation: every request the browser makes is routed through net-guard (SSRF-safe), and the
      # worker holds no secrets beyond DB/Redis. Set to "false" on a host that allows the sandbox.
      - key: BROWSER_NO_SANDBOX
        value: "true"
